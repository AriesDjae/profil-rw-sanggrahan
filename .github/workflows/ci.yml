name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  periksa:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: uji
          POSTGRES_PASSWORD: uji
          POSTGRES_DB: rw_uji
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U uji"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://uji:uji@localhost:5432/rw_uji
      SESSION_SECRET: rahasia-khusus-ci-bukan-untuk-produksi
      DASAR: http://localhost:3311

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npx playwright install --with-deps chromium

      - name: Terapkan migrasi dan data contoh
        run: |
          npx prisma migrate deploy
          npm run db:seed

      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build

      - name: Jalankan uji terhadap server produksi lokal
        run: |
          npx next start -p 3311 &
          npx wait-on --timeout 60000 http://localhost:3311/masuk
          npm run uji
